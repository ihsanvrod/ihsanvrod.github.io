<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ihsan Rodriguez — Developer</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --accent: #00e5a0;
      --accent-dim: rgba(0, 229, 160, 0.12);
      --bg: #0b0f14;
      --surface: #131920;
      --surface-2: #1a2230;
      --border: rgba(255,255,255,0.07);
      --text-muted: #6e7f94;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Syne', sans-serif;
      background-color: var(--bg);
      color: #e8edf2;
      overflow-x: hidden;
    }

    code, .mono { font-family: 'DM Mono', monospace; }

    /* ── Navbar ─────────────────────────────── */
    .navbar {
      background: rgba(11, 15, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .navbar-brand {
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      color: var(--accent) !important;
      letter-spacing: -0.02em;
    }

    .nav-link {
      color: var(--text-muted) !important;
      font-size: 0.875rem;
      transition: color 0.2s;
    }

    .nav-link:hover { color: #e8edf2 !important; }

    /* ── Hero ────────────────────────────────── */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 40%, transparent 100%);
    }

    .hero-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,160,0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hero-tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .hero-name {
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }

    .hero-name span {
      color: var(--accent);
    }

    .hero-bio {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .btn-accent {
      background: var(--accent);
      color: #0b0f14;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 0.65rem 1.5rem;
      border: none;
      border-radius: 4px;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn-accent:hover { opacity: 0.85; transform: translateY(-1px); color: #0b0f14; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      padding: 0.65rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-ghost:hover { border-color: rgba(255,255,255,0.25); color: #e8edf2; }

    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(6px); }
    }

    /* ── Section shared ──────────────────────── */
    section { padding: 5rem 0; }

    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .section-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .section-divider {
      width: 40px;
      height: 2px;
      background: var(--accent);
      margin-bottom: 3rem;
    }

    /* ── Project Cards ───────────────────────── */
    #projects { background: var(--surface); }

    .project-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.75rem;
      height: 100%;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s;
      position: relative;
      overflow: hidden;
    }

    .project-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .project-card:hover {
      border-color: rgba(0,229,160,0.3);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      color: inherit;
    }

    .project-card:hover::before { transform: scaleX(1); }

    .project-card-tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 3px 8px;
      border-radius: 3px;
      display: inline-block;
      margin-bottom: 1rem;
    }

    .project-card
